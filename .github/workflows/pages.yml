name: Preparar GitHub Pages

# P1: solo preparación manual. No configura Pages ni despliega.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      ONA_BASE: /
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Instalar desde lockfile sin scripts de paquetes
        run: npm ci --ignore-scripts
      - name: Comprobar raíz y build aislado bajo /ona/
        run: npm test
      - name: Generar el artefacto final bajo /ona/
        run: npm run build
        env:
          ONA_BASE: /ona/
      - name: Comprobar destinos del artefacto final
        run: node scripts/check-site.mjs dist /ona/
      - name: Guardar solo dist como artefacto de Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1
